import java.time.LocalDateTime

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        flatDir { dirs 'libs' }
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.44'
    id 'org.spongepowered.mixin' version '0.7.38'
}

configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
}

group = mod_group_id
version = getCustomVersion()

// Snapshot version
def getCustomVersion() {
    Date date = new Date()
    String month = LocalDateTime.now().getMonth().toString().substring(0, 3)
    return "v." + mod_version + "-" + date.format("dd") + month.charAt(0) + month.substring(1).toLowerCase() + date.format("yyyy") + '-Snapshot'
}

base {
    archivesName = "${mod_name} ${minecraft_version} Unofficial"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/deobfuscation.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory = project.file('run/client')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--username=BetaZavr${new Random().nextInt(10)}'
        }

        server {
            workingDirectory = project.file('run/server')
            property 'forge.enabledGameTestNamespaces', mod_id
            //args '--nogui'
        }

        gameTestServer {
            workingDirectory = project.file('run/test')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory = project.file('run/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    mavenCentral()
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version          : minecraft_version,
                             minecraft_version_range    : minecraft_version_range,
                             forge_version              : forge_version,
                             forge_version_range        : forge_version_range,
                             loader_version_range       : loader_version_range,
                             mod_id                     : mod_id,
                             mod_name                   : mod_name,
                             mod_license                : mod_license,
                             mod_version                : mod_version,
                             mod_credits                : mod_credits,
                             mod_authors                : mod_authors,
                             mod_description            : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : mod_version,
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
