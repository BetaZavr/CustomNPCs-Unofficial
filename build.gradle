/* In Russia, in 2026, some idiotic blocking of libraries and repositories began:
 1. For a new build of the project, comment out line "# org.gradle.offline=true"
 in file "gradle.properties" to download the Gradle cache;
 In Russia, you may need a VPN for this;
 2. Build this project command "./gradlew build" or by running a task;
 3. Then uncomment the line again and rebuild the project to run in semi-local mode;
 */

import java.time.LocalDateTime

// DEV resources path
buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

// Plugins for creating JAR
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.44'
    id 'org.spongepowered.mixin' version '0.7.38'
}

// JAR naming
version = getCustomVersion()
group = mod_group_id
base {
    archivesName = "${mod_name} ${minecraft_version} Unofficial"
}

// Snapshot version
def getCustomVersion() {
    Date date = new Date()
    String month = LocalDateTime.now().getMonth().toString().substring(0, 3)
    return "v." + mod_version + "-" + date.format("dd") + month.charAt(0) + month.substring(1).toLowerCase() + date.format("yyyy") + '-Snapshot'
}


// Set Java compatibility to version
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// launch in DEV environment
minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${buildDir}/createSrgToMcp/output.srg"
            property "mixin.debug", 'true'
            property "mixin.debug.verify", 'false'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {
            workingDirectory project.file('run/client')
            property 'forge.enabledGameTestNamespaces', mod_id
            args "--username=BetaZavr${new Random().nextInt(10)}".toString()
        }
        server {
            workingDirectory project.file('run/server')
            property 'forge.enabledGameTestNamespaces',
                    mod_id
            //args '--nogui'
        }
        gameTestServer {
            workingDirectory project.file('run/test')
            property 'forge.enabledGameTestNamespaces',
                    mod_id
        }
        data {
            workingDirectory project.file('run/data')
            args '--mod',
                    mod_id,
                    '--all',
                    '--output',
                    file('src/generated/resources/'),
                    '--existing',
                    file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Add Maven repositories
repositories {
    mavenLocal()
    mavenCentral()
}

// Project dependencies (required libraries)
dependencies {
    // Minecraft Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin Lib
    implementation('org.spongepowered:mixin:0.8.5') {
        exclude module: 'guava'
        exclude module: 'commons-io'
        exclude module: 'gson'
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version          : minecraft_version,
                             minecraft_version_range    : minecraft_version_range,
                             forge_version              : forge_version,
                             forge_version_range        : forge_version_range,
                             loader_version_range       : loader_version_range,
                             mod_id                     : mod_id,
                             mod_name                   : mod_name,
                             mod_display_name           : mod_display_name,
                             mod_license                : mod_license,
                             mod_version                : mod_version,
                             mod_credits                : mod_credits,
                             mod_author_list            : mod_authors,
                             mod_authors                : mod_authors.replace(", ", "\", \""),
                             mod_description            : mod_description,
                             mod_logo_file              : mod_logo_file,
                             mod_url                    : mod_url,
                             mod_update_url             : mod_update_url
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'mcmod.info', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"       : mod_id,
                    "Specification-Vendor"      : mod_authors,
                    "Specification-Version"     : mod_version,
                    "MixinConfigs"              : "mixins.${mod_id}.json".toString(),
                    "Implementation-Title"      : project.name,
                    "Implementation-Version"    : project.jar.archiveVersion,
                    "Implementation-Vendor"     : mod_authors,
                    "Implementation-Timestamp"  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
