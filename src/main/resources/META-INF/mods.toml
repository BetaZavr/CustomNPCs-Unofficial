modLoader="javafml" #mandatory
loaderVersion="${forge_version_range}" #mandatory (24 is current forge version)
issueTrackerURL="http://my.issue.tracker/" #optional
license="CC BY-NC"

[[mods]] #mandatory
    modId="${mod_id}" #mandatory
    version="${mod_version}" #mandatory
    displayName="${mod_display_name}" #mandatory
    #updateJSONURL="" #optional
    displayURL="${mod_url}" #optional
    logoFile="${mod_logo_file}" #optional
    credits="${mod_credits}"
    authors="${mod_author_list}" #optional
    description="${mod_description}"

[[dependencies."${mod_id}"]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"
[[dependencies."${mod_id}"]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"